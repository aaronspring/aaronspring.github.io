  <line x1="250" y1="250" x2="352" y2="169" stroke="#34D399" stroke-width="2.5" opacity="0.32"/>
  <line x1="250" y1="250" x2="352" y2="250" stroke="#A7F3D0" stroke-width="5" opacity="0.85"/>
