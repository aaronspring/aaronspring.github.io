  <line x1="250" y1="314" x2="352" y2="169" stroke="#34D399" stroke-width="2.5" opacity="0.20"/>
  <line x1="250" y1="314" x2="352" y2="250" stroke="#34D399" stroke-width="2.5" opacity="0.26"/>
  <line x1="250" y1="314" x2="352" y2="331" stroke="#34D399" stroke-width="2.5" opacity="0.32"/>
