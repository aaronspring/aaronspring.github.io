  <rect x="346" y="212" width="100" height="30" rx="14" fill="rgba(255,255,255,0.20)"/>
  <rect x="346" y="228" width="100" height="14" fill="rgba(255,255,255,0.20)"/>
  <rect x="364" y="248" width="52" height="10" rx="5" fill="rgba(255,255,255,0.70)"/>
