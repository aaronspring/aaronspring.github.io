    <circle cx="250" cy="186" r="24" fill="url(#nodeHidden)"/>
    <circle cx="250" cy="250" r="24" fill="url(#nodeHidden)"/>
    <circle cx="250" cy="314" r="24" fill="url(#nodeHidden)"/>
    <circle cx="250" cy="378" r="24" fill="url(#nodeHidden)"/>

