  <rect x="368" y="174" width="56" height="7" rx="3" fill="rgba(255,255,255,0.28)"/>
  <rect x="368" y="320" width="42" height="9" rx="4" fill="rgba(255,255,255,0.45)"/>
  <rect x="368" y="336" width="56" height="7" rx="3" fill="rgba(255,255,255,0.28)"/>

