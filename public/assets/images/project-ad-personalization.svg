  <line x1="112" y1="218" x2="250" y2="250" stroke="#A7F3D0" stroke-width="5" opacity="0.85"/>
  <line x1="112" y1="218" x2="250" y2="314" stroke="#34D399" stroke-width="2.5" opacity="0.28"/>
  <line x1="112" y1="218" x2="250" y2="378" stroke="#34D399" stroke-width="2.5" opacity="0.34"/>
  <line x1="112" y1="284" x2="250" y2="122" stroke="#34D399" stroke-width="2.5" opacity="0.34"/>
