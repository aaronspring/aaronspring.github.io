<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termGrad" x1="90" y1="110" x2="410" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="termShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#7C2D12" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="250" cy="452" rx="138" ry="14" fill="#7C2D12" opacity="0.1"/>

  <!-- Terminal window: the agent you configure -->
  <g filter="url(#termShadow)">
    <rect x="90" y="120" width="320" height="240" rx="18" fill="url(#termGrad)"/>
  </g>

  <!-- Title bar -->
  <rect x="90" y="120" width="320" height="34" rx="18" fill="rgba(255,255,255,0.18)"/>
  <rect x="90" y="140" width="320" height="14" fill="rgba(255,255,255,0.18)"/>
  <circle cx="114" cy="137" r="6" fill="rgba(255,255,255,0.55)"/>
  <circle cx="134" cy="137" r="6" fill="rgba(255,255,255,0.40)"/>
  <circle cx="154" cy="137" r="6" fill="rgba(255,255,255,0.25)"/>

  <!-- Prompt caret + command lines -->
  <path d="M118 182 l14 11 -14 11" stroke="rgba(255,255,255,0.75)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="146" y="187" width="150" height="10" rx="5" fill="rgba(255,255,255,0.55)"/>
  <rect x="118" y="216" width="196" height="9" rx="4" fill="rgba(255,255,255,0.30)"/>
  <rect x="118" y="238" width="140" height="9" rx="4" fill="rgba(255,255,255,0.22)"/>
  <rect x="118" y="260" width="220" height="9" rx="4" fill="rgba(255,255,255,0.30)"/>
  <rect x="118" y="282" width="96" height="9" rx="4" fill="rgba(255,255,255,0.22)"/>
  <rect x="118" y="312" width="26" height="12" rx="4" fill="rgba(255,255,255,0.70)"/>

  <!-- Two days, hands-on: two seats around the same terminal -->
  <circle cx="118" cy="404" r="20" fill="#FDBA74"/>
  <path d="M86 448 a32 30 0 0 1 64 0 z" fill="#FDBA74" opacity="0.85"/>
  <circle cx="250" cy="410" r="24" fill="#F97316"/>
  <path d="M212 452 a38 34 0 0 1 76 0 z" fill="#F97316" opacity="0.85"/>
  <circle cx="382" cy="404" r="20" fill="#FDBA74"/>
  <path d="M350 448 a32 30 0 0 1 64 0 z" fill="#FDBA74" opacity="0.85"/>
</svg>
