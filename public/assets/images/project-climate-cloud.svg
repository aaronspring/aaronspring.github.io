<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- userSpaceOnUse so all overlapping circles share one seamless gradient -->
    <linearGradient id="cloudGrad" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="48%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <radialGradient id="star" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2E1065" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="250" cy="452" rx="138" ry="14" fill="#4C1D95" opacity="0.1"/>

  <!-- Cloud body: overlapping circles, same gradient = seamless fill -->
  <g filter="url(#shadow)">
    <circle cx="250" cy="282" r="100" fill="url(#cloudGrad)"/>
    <circle cx="165" cy="260" r="76" fill="url(#cloudGrad)"/>
    <circle cx="338" cy="263" r="82" fill="url(#cloudGrad)"/>
    <circle cx="208" cy="212" r="66" fill="url(#cloudGrad)"/>
    <circle cx="300" cy="208" r="64" fill="url(#cloudGrad)"/>
  </g>

  <!-- Specular highlights (lit from top-left) -->
  <circle cx="192" cy="202" r="40" fill="rgba(255,255,255,0.20)"/>
  <circle cx="295" cy="198" r="30" fill="rgba(255,255,255,0.12)"/>
  <circle cx="155" cy="252" r="26" fill="rgba(255,255,255,0.14)"/>

  <!-- Array data grid overlay (represents multidimensional xarray data) -->
  <!-- Row 1 — lat axis -->
  <rect x="195" y="288" width="24" height="15" rx="3" fill="rgba(255,255,255,0.38)"/>
  <rect x="226" y="288" width="24" height="15" rx="3" fill="rgba(255,255,255,0.28)"/>
  <rect x="257" y="288" width="24" height="15" rx="3" fill="rgba(255,255,255,0.48)"/>
  <rect x="288" y="288" width="24" height="15" rx="3" fill="rgba(255,255,255,0.28)"/>
  <rect x="319" y="288" width="24" height="15" rx="3" fill="rgba(255,255,255,0.18)"/>
  <!-- Row 2 — lon axis -->
  <rect x="195" y="310" width="24" height="15" rx="3" fill="rgba(255,255,255,0.22)"/>
  <rect x="226" y="310" width="24" height="15" rx="3" fill="rgba(255,255,255,0.42)"/>
  <rect x="257" y="310" width="24" height="15" rx="3" fill="rgba(255,255,255,0.22)"/>
  <rect x="288" y="310" width="24" height="15" rx="3" fill="rgba(255,255,255,0.35)"/>
  <rect x="319" y="310" width="24" height="15" rx="3" fill="rgba(255,255,255,0.22)"/>
  <!-- Row 3 — time axis -->
  <rect x="195" y="332" width="24" height="15" rx="3" fill="rgba(255,255,255,0.16)"/>
  <rect x="226" y="332" width="24" height="15" rx="3" fill="rgba(255,255,255,0.16)"/>
  <rect x="257" y="332" width="24" height="15" rx="3" fill="rgba(255,255,255,0.28)"/>
  <rect x="288" y="332" width="24" height="15" rx="3" fill="rgba(255,255,255,0.16)"/>
  <rect x="319" y="332" width="24" height="15" rx="3" fill="rgba(255,255,255,0.38)"/>

  <!-- Axis label dashes (tiny, suggesting dimension labels) -->
  <rect x="168" y="290" width="18" height="5" rx="2" fill="rgba(255,255,255,0.45)"/>
  <rect x="168" y="312" width="14" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="168" y="334" width="22" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
</svg>
