<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bar front face: light top → dark bottom -->
    <linearGradient id="barFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <!-- Bar top face: lightest -->
    <linearGradient id="barTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- Platform -->
    <linearGradient id="platform" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <!-- AI sparkle -->
    <radialGradient id="spark" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2E1065" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="272" cy="455" rx="165" ry="14" fill="#4C1D95" opacity="0.1"/>

  <g filter="url(#shadow)">
    <!-- Platform (isometric floor) -->
    <!-- Top face -->
    <path d="M 78,360 L 432,360 L 452,348 L 98,348 Z" fill="url(#barTop)"/>
    <!-- Front face -->
    <rect x="78" y="360" width="354" height="18" rx="4" fill="url(#platform)"/>
    <!-- Right face -->
    <path d="M 432,360 L 452,348 L 452,366 L 432,378 Z" fill="#2E1065" opacity="0.6"/>

    <!-- BAR 1 (x=98, height=68) -->
    <!-- Right face -->
    <path d="M 160,292 L 178,282 L 178,350 L 160,360 Z" fill="#2E1065" opacity="0.55"/>
    <!-- Front face -->
    <rect x="98" y="292" width="62" height="68" fill="url(#barFront)"/>
    <!-- Top face -->
    <path d="M 98,292 L 160,292 L 178,282 L 116,282 Z" fill="url(#barTop)"/>

    <!-- BAR 2 (x=185, height=112) -->
    <path d="M 247,248 L 265,238 L 265,350 L 247,360 Z" fill="#2E1065" opacity="0.55"/>
    <rect x="185" y="248" width="62" height="112" fill="url(#barFront)"/>
    <path d="M 185,248 L 247,248 L 265,238 L 203,238 Z" fill="url(#barTop)"/>

    <!-- BAR 3 (x=272, height=158) -->
    <path d="M 334,202 L 352,192 L 352,350 L 334,360 Z" fill="#2E1065" opacity="0.55"/>
    <rect x="272" y="202" width="62" height="158" fill="url(#barFront)"/>
    <path d="M 272,202 L 334,202 L 352,192 L 290,192 Z" fill="url(#barTop)"/>

    <!-- BAR 4 (x=359, height=210) -->
    <path d="M 421,150 L 439,140 L 439,350 L 421,360 Z" fill="#2E1065" opacity="0.55"/>
    <rect x="359" y="150" width="62" height="210" fill="url(#barFront)"/>
    <path d="M 359,150 L 421,150 L 439,140 L 377,140 Z" fill="url(#barTop)"/>
  </g>

  <!-- Front face specular highlights (lit stripe on left of each bar) -->
  <rect x="100" y="294" width="12" height="64" rx="3" fill="rgba(255,255,255,0.16)"/>
  <rect x="187" y="250" width="12" height="108" rx="3" fill="rgba(255,255,255,0.16)"/>
  <rect x="274" y="204" width="12" height="154" rx="3" fill="rgba(255,255,255,0.16)"/>
  <rect x="361" y="152" width="12" height="206" rx="3" fill="rgba(255,255,255,0.16)"/>

  <!-- AI sparkle above tallest bar: a 4-pointed star = "AI prediction" -->
  <path d="M390,112 L393,122 L403,125 L393,128 L390,138 L387,128 L377,125 L387,122 Z" fill="url(#spark)"/>
  <!-- Smaller satellite sparks -->
  <path d="M408,100 L410,106 L416,108 L410,110 L408,116 L406,110 L400,108 L406,106 Z" fill="url(#spark)" opacity="0.75"/>
  <path d="M373,95 L375,101 L381,103 L375,105 L373,111 L371,105 L365,103 L371,101 Z" fill="url(#spark)" opacity="0.6"/>
</svg>
