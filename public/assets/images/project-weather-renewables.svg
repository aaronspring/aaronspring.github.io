<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="90" y1="170" x2="330" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="tower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="spark" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2E1065" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="250" cy="455" rx="170" ry="14" fill="#4C1D95" opacity="0.1"/>

  <!-- Satellite (top right): body + two solar panels -->
  <g filter="url(#shadow)" transform="rotate(-25 380 95)">
    <rect x="300" y="82" width="52" height="26" rx="3" fill="url(#panel)"/>
    <rect x="408" y="82" width="52" height="26" rx="3" fill="url(#panel)"/>
    <line x1="352" y1="95" x2="408" y2="95" stroke="#A78BFA" stroke-width="4"/>
    <rect x="362" y="74" width="36" height="42" rx="6" fill="url(#body)"/>
  </g>
  <!-- Panel grid lines -->
  <g transform="rotate(-25 380 95)" stroke="#164E63" stroke-width="1.5" opacity="0.5">
    <line x1="317" y1="82" x2="317" y2="108"/>
    <line x1="334" y1="82" x2="334" y2="108"/>
    <line x1="425" y1="82" x2="425" y2="108"/>
    <line x1="442" y1="82" x2="442" y2="108"/>
  </g>

  <!-- Signal arcs from satellite down to the cloud -->
  <g stroke="#22D3EE" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 330,150 Q 310,170 312,196" opacity="0.9"/>
    <path d="M 306,138 Q 278,166 284,204" opacity="0.6"/>
    <path d="M 282,126 Q 246,162 256,212" opacity="0.35"/>
  </g>

  <!-- Weather cloud -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="300" r="70" fill="url(#cloudGrad)"/>
    <circle cx="135" cy="290" r="52" fill="url(#cloudGrad)"/>
    <circle cx="265" cy="298" r="56" fill="url(#cloudGrad)"/>
    <circle cx="175" cy="248" r="50" fill="url(#cloudGrad)"/>
    <circle cx="240" cy="250" r="44" fill="url(#cloudGrad)"/>
  </g>
  <!-- Cloud highlights -->
  <circle cx="160" cy="232" r="18" fill="rgba(255,255,255,0.22)"/>
  <circle cx="120" cy="276" r="12" fill="rgba(255,255,255,0.16)"/>

  <!-- AI sparkle inside the cloud -->
  <path d="M205,268 L210,286 L228,291 L210,296 L205,314 L200,296 L182,291 L200,286 Z" fill="url(#spark)"/>
  <path d="M236,312 L239,321 L248,324 L239,327 L236,336 L233,327 L224,324 L233,321 Z" fill="url(#spark)" opacity="0.75"/>

  <!-- Wind turbine (bottom right) -->
  <g filter="url(#shadow)">
    <path d="M 383,440 L 389,250 L 395,250 L 401,440 Z" fill="url(#tower)"/>
    <g transform="translate(392 250)">
      <path d="M -4,0 L 0,-92 L 6,-4 Z" fill="url(#tower)"/>
      <path d="M -4,0 L 0,-92 L 6,-4 Z" fill="url(#tower)" transform="rotate(120)"/>
      <path d="M -4,0 L 0,-92 L 6,-4 Z" fill="url(#tower)" transform="rotate(240)"/>
      <circle r="9" fill="url(#body)"/>
    </g>
  </g>

  <!-- Solar panel (bottom left) -->
  <g filter="url(#shadow)">
    <path d="M 70,430 L 150,430 L 170,390 L 90,390 Z" fill="url(#panel)"/>
    <rect x="114" y="430" width="8" height="16" fill="#6D28D9"/>
  </g>
  <g stroke="#164E63" stroke-width="1.5" opacity="0.5">
    <line x1="100" y1="430" x2="117" y2="390"/>
    <line x1="125" y1="430" x2="142" y2="390"/>
    <line x1="80" y1="410" x2="160" y2="410"/>
  </g>
</svg>
